# ══════════════════════════════════════════════════════════════════════
# Serving the static export.
#
# There is no application here — just files. That is the whole point of
# `output: "export"`: the public site cannot be taken down by a backend
# failure, because at request time there is no backend involved (§6.2).
#
# Every location block INCLUDES nginx-security-headers.conf. That is not
# repetition for its own sake — see the header of that file for why
# omitting it silently drops every security header on the site.
# ══════════════════════════════════════════════════════════════════════

server {
  # 8080, not 80. This image runs as an unprivileged user, which cannot
  # bind a port below 1024. Port mapping makes that invisible outside.
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Next is configured with trailingSlash: true, so every route is a
  # DIRECTORY containing index.html — /events/ is events/index.html on
  # disk. Without $uri/ in try_files every route but the root 404s.
  #
  # It ends in =404, NOT in /404.html. Naming the error page as the last
  # try_files argument makes it an internal redirect, which nginx serves
  # with status 200 — so every unknown URL would return "200 OK" with the
  # not-found page in the body. Search engines index that, and monitoring
  # never fires. `error_page` below renders the same file with the right
  # status.
  location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    try_files $uri $uri/ $uri.html =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    include /etc/nginx/security-headers.conf;
    internal;
  }

  # ── Caching ────────────────────────────────────────────────────────
  #
  # Next fingerprints everything under /_next/static with a content hash,
  # so those are immutable — the same rule, and the same reasoning, as the
  # content-addressed storage keys.
  #
  # No `expires` directive anywhere below: it emits its OWN Cache-Control,
  # so combining it with add_header sends the header twice with different
  # values. Observed on the first build:
  #
  #   Cache-Control: max-age=31536000
  #   Cache-Control: public, max-age=31536000, immutable
  #
  # Which one a given cache honours is not worth finding out.
  location /_next/static/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
  }

  # Images and fonts served from THIS origin — the brand mark and the 240
  # rover frames, which are build artefacts rather than content (§B2).
  # Archive photographs come from object storage and never reach nginx.
  location ~* \.(avif|webp|png|jpg|svg|woff2)$ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=2592000" always;
    access_log off;
  }

  # No CSP here on purpose. A meaningful one has to name the storage
  # origin and the API origin, both of which are environment-specific and
  # baked in at build time — so a CSP written into the image would be
  # wrong for every deployment but one. It belongs on the reverse proxy or
  # CDN that terminates TLS, where those values are known. Stated rather
  # than silently omitted, so nobody assumes it is handled.

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/manifest+json;
  # Deliberately not gzipping avif/webp/woff2 — already compressed, and
  # re-compressing costs CPU to make them fractionally larger.

  # Health endpoint for the orchestrator. Static, so it answers whenever
  # nginx is up — which for a static site is exactly what "healthy" means.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain always;
    return 200 "ok\n";
  }
}
