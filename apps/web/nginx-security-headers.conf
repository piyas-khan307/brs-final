# ══════════════════════════════════════════════════════════════════════
# Security headers, in a file so they can be INCLUDED in every location.
#
# ── WHY THIS IS NOT JUST WRITTEN ONCE AT SERVER LEVEL ──
# nginx's add_header does not merge across levels: if a `location` block
# contains ANY add_header, every add_header inherited from the enclosing
# `server` is discarded. Not overridden — dropped entirely.
#
# The first version of this config set the security headers once on the
# server and per-location Cache-Control inside the location blocks. The
# result was a site serving NO security headers at all, and nothing warned
# about it. Verified with curl before and after:
#
#   before   Cache-Control only
#   after    X-Content-Type-Options, X-Frame-Options, Referrer-Policy,
#            Permissions-Policy, Cache-Control
#
# `always` on each one so they survive error responses too — otherwise a
# 404 page ships unprotected.
# ══════════════════════════════════════════════════════════════════════

add_header X-Content-Type-Options "nosniff"                          always;
add_header X-Frame-Options        "DENY"                             always;
add_header Referrer-Policy        "strict-origin-when-cross-origin"  always;
add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
